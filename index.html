<!-- Apply the system light/dark preference as early as possible (before first
     paint) to avoid a flash of the wrong theme, and keep listening so the page
     switches instantly if the system theme changes while it's open.
     iOS only reads apple-mobile-web-app-status-bar-style at launch (it can't
     be live-updated mid-session the way theme-color can), so this sets the
     best matching value up front — "black-translucent" (light status-bar
     icons over a transparent bar) for dark mode, "default" (dark icons) for
     light mode — which takes effect from the next time the home-screen app
     is opened. -->
<script>
  (function () {
    try {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var statusBarMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      function applyTheme(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        if (statusBarMeta) statusBarMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
      }
      applyTheme(mq.matches);
      if (mq.addEventListener) {
        mq.addEventListener('change', function (e) { applyTheme(e.matches); });
      } else if (mq.addListener) {
        mq.addListener(function (e) { applyTheme(e.matches); }); // older Safari fallback
      }
    } catch (e) { /* matchMedia unsupported: just stay in light mode */ }
  })();
</script>

<script src="questions.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------
   * Data / storage helpers
   * ------------------------------------------------------------- */
  const STORAGE_KEY = "wangwang_quiz_progress_v1";
  const BANK_CACHE_KEY = "wangwang_quiz_bank_source_v1";
  const IDENTITY_KEY = "wangwang_quiz_identity_v1";
  const TOTAL_ANSWERED_KEY = "wangwang_quiz_total_answered_v1";
  const EXAM_HISTORY_KEY = "wangwang_quiz_exam_history_v1";
  const MAX_HISTORY_ENTRIES = 20;

  /* ---------------------------------------------------------------
   * Cloud sync (Google Apps Script + Google Sheet backend)
   *
   * Paste the web app URL you get from deploying the companion Apps
   * Script (Deploy > New deployment > Web app, "Execute as: Me",
   * "Who has access: Anyone") below. Leaving it as the placeholder
   * text disables all cloud features — the app still works fully
   * offline using localStorage only.
   * ------------------------------------------------------------- */
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzU2uON7RgRfNWTAOdEzQ6wabi5FxZDYDrkibQHYbQJDkKakw21EolvIEDPgctQd_0Q/exec";

  function isCloudConfigured() {
    return typeof GAS_API_URL === "string" && /^https?:\/\//i.test(GAS_API_URL.trim());
  }

  function getIdentity() {
    try {
      const raw = localStorage.getItem(IDENTITY_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && parsed.name && parsed.employeeId) return parsed;
      return null;
    } catch (e) { return null; }
  }
  function setIdentity(identity) {
    try { localStorage.setItem(IDENTITY_KEY, JSON.stringify(identity)); } catch (e) {}
  }

  /* All per-person data below (dog-level progress, total-answered counter,
     exam history) is stored under a key that includes the *current* employee
     ID. This matters on a shared device: without this, switching from one
     employee ID to another would keep reading/writing the same bucket and
     the new person would inherit whoever used the device before them. */
  function currentStorageScope() {
    const identity = getIdentity();
    return identity && identity.employeeId ? String(identity.employeeId) : "anonymous";
  }
  function scopedKey(base) {
    return base + "::" + currentStorageScope();
  }

  function getTotalAnswered() {
    try { return parseInt(localStorage.getItem(scopedKey(TOTAL_ANSWERED_KEY)) || "0", 10) || 0; } catch (e) { return 0; }
  }
  function incrementTotalAnswered() {
    const v = getTotalAnswered() + 1;
    try { localStorage.setItem(scopedKey(TOTAL_ANSWERED_KEY), String(v)); } catch (e) {}
    return v;
  }

  /* ---------------------------------------------------------------
   * Exam history — a lightweight log of each finished study/test round.
   * Only q.id + the chosen letters + right/wrong are stored (not full
   * question text), so 20 entries stay tiny; full question text/options/
   * explanation are looked up fresh from the current bank when the person
   * expands an entry.
   * ------------------------------------------------------------- */
  function getExamHistory() {
    try {
      const raw = localStorage.getItem(scopedKey(EXAM_HISTORY_KEY));
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveExamHistory(list) {
    try { localStorage.setItem(scopedKey(EXAM_HISTORY_KEY), JSON.stringify(list)); } catch (e) {}
  }
  function indexForLetter(letter) {
    return String(letter || "").toUpperCase().charCodeAt(0) - 65;
  }
  function formatTimestampNow() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  /* items: [{ qId, selected: [0-based indices], correct }] */
  function buildExamHistoryEntry(mode, items) {
    const total = items.length;
    const correctCount = items.filter(it => it.correct).length;
    return {
      id: Date.now(),
      timestamp: formatTimestampNow(),
      mode,
      total,
      correctCount,
      wrongCount: total - correctCount,
      details: items.map(it => ({
        qId: String(it.qId),
        userAns: (it.selected || []).map(i => letterFor(i)),
        isCorrect: !!it.correct
      }))
    };
  }
  /* Records a finished round (skips rounds where nothing was actually
     answered) and keeps only the most recent MAX_HISTORY_ENTRIES locally. */
  function addExamHistoryEntry(mode, items) {
    if (!items || items.length === 0) return null;
    const entry = buildExamHistoryEntry(mode, items);
    const history = getExamHistory();
    history.unshift(entry);
    saveExamHistory(history.slice(0, MAX_HISTORY_ENTRIES));
    return entry;
  }
  /* Combines cloud + local history by entry id, newest first, capped at
     MAX_HISTORY_ENTRIES — used when restoring on a new device. */
  function mergeExamHistory(cloudLogs) {
    if (!Array.isArray(cloudLogs) || cloudLogs.length === 0) return false;
    const local = getExamHistory();
    const seen = new Set();
    const merged = [];
    local.concat(cloudLogs).forEach(entry => {
      if (!entry || entry.id === undefined) return;
      const key = String(entry.id);
      if (seen.has(key)) return;
      seen.add(key);
      merged.push(entry);
    });
    merged.sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0));
    const trimmed = merged.slice(0, MAX_HISTORY_ENTRIES);
    const changed = JSON.stringify(trimmed) !== JSON.stringify(local);
    if (changed) saveExamHistory(trimmed);
    return changed;
  }

  /* Validate that a parsed value looks like a usable question bank. */
  function isValidBank(arr) {
    if (!Array.isArray(arr) || arr.length === 0) return false;
    return arr.every(q => q && typeof q === "object"
      && Array.isArray(q.options) && q.options.length > 0
      && Array.isArray(q.answer));
  }

  /* Defends against duplicate ids in the source question bank (e.g. a
     copy-paste mistake in questions.js). Progress is keyed by q.id, so if the
     same id appears more than once in `bank`, a single answer to that
     question would otherwise get counted once per duplicate row when
     tallying "X 題 in N 隻狗" — the exact symptom of one correct answer
     appearing to bump far more than one question. Keeps the first
     occurrence of each id and drops the rest. */
  function dedupeBankById(arr) {
    if (!Array.isArray(arr)) return arr;
    const seen = new Set();
    const result = [];
    arr.forEach(q => {
      if (!q || q.id === undefined || q.id === null) return;
      const key = String(q.id);
      if (seen.has(key)) return;
      seen.add(key);
      result.push(q);
    });
    return result;
  }

  let bank = (typeof window.QUESTION_BANK !== "undefined" && Array.isArray(window.QUESTION_BANK) && window.QUESTION_BANK.length > 0)
    ? dedupeBankById(window.QUESTION_BANK)
    : null;
  let importError = "";

  /* Parse raw file text (either a .json array, or a .js file that assigns
     window.QUESTION_BANK = [...]) into a question-bank array, or null. */
  function parseQuestionBankText(text, filename) {
    const trimmed = (text || "").trim();
    const looksJson = /\.json$/i.test(filename || "") || /^[\[{]/.test(trimmed);

    if (looksJson) {
      try {
        const parsed = JSON.parse(trimmed);
        if (isValidBank(parsed)) return parsed;
        if (parsed && isValidBank(parsed.QUESTION_BANK)) return parsed.QUESTION_BANK;
      } catch (e) { /* fall through and try as JS below */ }
    }

    // Execute as JS inside a sandboxed fake "window" so `window.QUESTION_BANK = [...]`
    // assignments can be captured without touching the real global window.
    try {
      const fn = new Function("window", trimmed + "\n;return (window && window.QUESTION_BANK) || (typeof QUESTION_BANK !== 'undefined' ? QUESTION_BANK : null);");
      const result = fn({});
      if (isValidBank(result)) return result;
    } catch (e) { /* fall through to regex fallback */ }

    // Last resort: pull out the array literal that follows QUESTION_BANK =
    const m = trimmed.match(/QUESTION_BANK\s*=\s*(\[[\s\S]*\])\s*;?\s*$/);
    if (m) {
      try {
        const result2 = new Function("return (" + m[1] + ");")();
        if (isValidBank(result2)) return result2;
      } catch (e) { /* give up */ }
    }
    return null;
  }

  function cacheBankSource(text) {
    try { localStorage.setItem(BANK_CACHE_KEY, text); } catch (e) {}
  }

  /* If no bundled bank was found, try a previously-imported copy cached
     in localStorage (handy for preview environments that reload the page). */
  if (!bank) {
    try {
      const cached = localStorage.getItem(BANK_CACHE_KEY);
      if (cached) {
        const parsed = parseQuestionBankText(cached, "cached.js");
        if (parsed) bank = dedupeBankById(parsed);
      }
    } catch (e) {}
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(scopedKey(STORAGE_KEY));
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(scopedKey(STORAGE_KEY), JSON.stringify(p)); } catch (e) {}
  }
  let progress = loadProgress();
  /* Re-reads progress from storage under whichever employee ID is now
     active. Must be called right after switching identity on the same
     device, otherwise the in-memory `progress` object would keep pointing
     at the previous person's data even though storage itself is correctly
     scoped. */
  function reloadProgressForCurrentIdentity() {
    progress = loadProgress();
  }

  function getLevel(id) {
    const v = progress[id];
    return (typeof v === "number" && v >= 0 && v <= 3) ? v : 0;
  }
  function setLevel(id, level) {
    level = Math.max(0, Math.min(3, level));
    progress[id] = level;
    saveProgress(progress);
    return level;
  }
  function bumpLevel(id, wasCorrect) {
    const cur = getLevel(id);
    const next = wasCorrect ? Math.min(3, cur + 1) : Math.max(0, cur - 1);
    return setLevel(id, next);
  }

  /* ---------------------------------------------------------------
   * Generic helpers
   * ------------------------------------------------------------- */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function sample(arr, n) {
    return shuffle(arr).slice(0, Math.min(n, arr.length));
  }
  function letterFor(i) { return String.fromCharCode(65 + i); }
  function setsEqual(a, b) {
    // Order-independent, exact-match comparison (sort then compare as JSON),
    // e.g. sortedA === sortedB via JSON.stringify — used for multi-choice
    // grading, where the learner's picks must match the answer key exactly
    // (no missed options, no extra options) to count as correct.
    if (!Array.isArray(a) || !Array.isArray(b)) return false;
    if (a.length !== b.length) return false;
    const sortedA = a.slice().sort((x, y) => x - y);
    const sortedB = b.slice().sort((x, y) => x - y);
    return JSON.stringify(sortedA) === JSON.stringify(sortedB);
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  /* Question banks often write explanations as one packed line, e.g.
     "總結說明...A正確：因為... B錯誤：因為... C.其他說明 D、最後一點"
     This inserts a line break right before each A/B/C/D option marker
     (matching "A正確", "A錯誤", "A.", "A、", "A：", "A:", "A)" style markers)
     so the explanation reads as one line per option instead of a wall of text.
     Pair with the `whitespace-pre-line` Tailwind class on the element that
     renders the result, so the inserted "\n" characters actually break the line. */
  function formatExplanation(text) {
    if (!text) return "";
    let formatted = String(text).replace(
      /\s*([A-D])(?=[.、:：\)\uFF09]|正確|正确|錯誤|错误|不正確|不正确)/g,
      "\n$1"
    );
    formatted = formatted.replace(/^\n+/, "");
    return formatted.trim();
  }

  /* prepare a runtime instance of a question: only the question ORDER is
     randomized (handled by the caller shuffling the pool); the options
     themselves always keep their original A/B/C/D order so the on-screen
     labels stay consistent with the answer key in the source data and
     never jump around after answering. */
  function prepareInstance(q) {
    return {
      id: q.id,
      type: q.type,
      question: q.question,
      explanation: q.explanation || "",
      options: q.options.slice(),
      correctIndices: q.answer.slice()
    };
  }

  function dogHtml(level, size) {
    size = size || "text-base";
    let html = '<span class="inline-flex items-center gap-0.5 ' + size + '">';
    for (let i = 0; i < 3; i++) {
      html += '<span class="dog-icon' + (i < level ? ' filled' : '') + '">🐕</span>';
    }
    html += '</span>';
    return html;
  }

  function overallStats() {
    const total = bank.length;
    let sum = 0, mastered = 0, byLevel = [0,0,0,0];
    bank.forEach(q => {
      const lv = getLevel(q.id);
      sum += lv;
      byLevel[lv]++;
      if (lv === 3) mastered++;
    });
    const pct = total ? Math.round((sum / (total * 3)) * 100) : 0;
    return { total, pct, mastered, byLevel };
  }

  /* ---------------------------------------------------------------
   * Cloud sync helpers — best-effort only. Network failures never
   * block the UI; practicing offline always keeps working locally.
   * ------------------------------------------------------------- */
  function buildSyncPayload() {
    const identity = getIdentity() || { name: "", employeeId: "" };
    const s = overallStats();
    return {
      employeeId: identity.employeeId,
      name: identity.name,
      totalAnswered: getTotalAnswered(),
      threeDogCount: s.byLevel[3],
      masteryPercent: s.pct,
      dogDetails: JSON.stringify(progress), // full per-question 0~3 mastery map
      examLogs: JSON.stringify(getExamHistory()) // most recent rounds' answer history
    };

  function syncToCloud() {
    if (!isCloudConfigured()) return;
    const identity = getIdentity();
    if (!identity) return;
    try {
      fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight against Apps Script
        body: JSON.stringify(buildSyncPayload())
      }).catch(() => { /* best-effort; ignore network errors */ });
    } catch (e) { /* ignore */ }
  }

  /* Pulls this employee's full per-question dog-level record (and recent
     exam history) from the cloud and merges it into local storage, taking
     whichever side has the HIGHER dog count for each question — so
     switching devices never loses whatever progress is furthest along on
     either side. */
  function tryCloudRestore() {
    if (!isCloudConfigured()) return Promise.resolve();
    const identity = getIdentity();
    if (!identity) return Promise.resolve();
    return fetch(GAS_API_URL + "?action=getUser&empId=" + encodeURIComponent(identity.employeeId))
      .then(res => res.json())
      .then(json => {
        if (!json || json.status !== "ok" || !json.data) return;
        const cloudDogDetails = json.data.dogDetails || {};
        let changed = false;
        Object.keys(cloudDogDetails).forEach(qid => {
          const cloudLevel = Number(cloudDogDetails[qid]) || 0;
          const localLevel = (qid in progress) ? (Number(progress[qid]) || 0) : -1;
          if (cloudLevel > localLevel) {
            progress[qid] = cloudLevel;
            changed = true;
          }
        });
        if (changed) {
          saveProgress(progress);
          if (view === "home") renderHome();
        }
        // Keep the "累積練習題數" counter as the higher of the two devices too,
        // so it reads consistently on the leaderboard no matter which device synced last.
        const cloudTotalAnswered = Number(json.data.totalAnswered) || 0;
        if (cloudTotalAnswered > getTotalAnswered()) {
          try { localStorage.setItem(TOTAL_ANSWERED_KEY, String(cloudTotalAnswered)); } catch (e) {}
        }
        // Merge in any exam-history rounds recorded on other devices.
        mergeExamHistory(json.data.examLogs);
      })
      .catch(() => { /* best-effort; ignore network errors */ });
  }

  function formatDateTime(value) {
    if (!value) return "—";
    try {
      const d = new Date(value);
      if (isNaN(d.getTime())) return String(value);
      return d.toLocaleString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return String(value); }
  }

  /* ---------------------------------------------------------------
   * Shared option-rendering helpers
   *
   * Two visual states for an option button:
   *  - interactive multi-select (not yet submitted): clicking toggles
   *    selection; selected options get a bold, high-contrast fill so the
   *    choice is unmistakable.
   *  - revealed (locked, after answering): correct options are green,
   *    any wrong option the learner picked is red, everything else is neutral.
   * ------------------------------------------------------------- */
  function themeColors(theme) {
    return theme === "mustard"
      ? { border: "border-mustard-dark", bg: "bg-mustard", text: "text-ink", hover: "hover:border-mustard/60" }
      : { border: "border-leash", bg: "bg-leash", text: "text-white", hover: "hover:border-leash/60" };
  }

  function multiOptionHtml(options, selectedSet, theme) {
    const c = themeColors(theme);
    return options.map((opt, i) => {
      const selected = selectedSet.has(i);
      const cls = selected
        ? `option-btn focus-ring w-full text-left border-2 ${c.border} ${c.bg} ${c.text} shadow-md rounded-xl px-4 py-3 flex items-center gap-3`
        : `option-btn focus-ring w-full text-left border-2 border-line bg-sand/40 ${c.hover} rounded-xl px-4 py-3 flex items-center gap-3`;
      const checkbox = selected
        ? `<span class="w-6 h-6 rounded-md bg-white/95 flex items-center justify-center text-base font-800 shrink-0 ${theme === "mustard" ? "text-mustard-ink" : "text-leash"}">✓</span>`
        : `<span class="w-6 h-6 rounded-md border-2 border-ink/25 shrink-0"></span>`;
      return `<button type="button" data-i="${i}" class="multiOptBtn ${cls}">
        ${checkbox}
        <span class="font-display font-700 ${selected ? "" : "text-ink/50"}">${letterFor(i)}</span>
        <span class="flex-1">${escapeHtml(opt)}</span>
      </button>`;
    }).join("");
  }

  function singleOptionHtml(options) {
    return options.map((opt, i) => `
      <button type="button" data-i="${i}" class="singleOptBtn option-btn focus-ring w-full text-left border-2 border-line rounded-xl px-4 py-3 bg-sand/40 hover:border-leash/60 flex gap-3">
        <span class="font-display font-700 text-ink/50">${letterFor(i)}</span>
        <span class="flex-1">${escapeHtml(opt)}</span>
      </button>`).join("");
  }

  /* Revealed / locked option list shown after answering.
     - Single-choice: correct option is green, a wrong pick is red, everything
       else stays neutral.
     - Multiple-choice: four clearly distinct states so every option's fate is
       obvious — grey (not selected, not correct), green (correct and picked),
       orange (correct but missed), red (picked but wrong). */
  function revealedOptionHtml(options, correctIndices, selectedIndices, isMultiple) {
    return options.map((opt, i) => {
      const isCorrectOpt = correctIndices.includes(i);
      const wasSelected = selectedIndices.includes(i);
      let cls = "border-line bg-sand/30";
      let mark = "";

      if (isMultiple) {
        if (isCorrectOpt && wasSelected) { cls = "border-leash bg-leash-light"; mark = `<span class="text-leash-ink text-xs font-700 shrink-0">✔ 答對</span>`; }
        else if (isCorrectOpt && !wasSelected) { cls = "border-mustard-dark bg-mustard-light"; mark = `<span class="text-mustard-ink text-xs font-700 shrink-0">⚠ 漏選</span>`; }
        else if (!isCorrectOpt && wasSelected) { cls = "border-rose bg-rose-light"; mark = `<span class="text-rose-ink text-xs font-700 shrink-0">✘ 選錯</span>`; }
        else { cls = "border-line bg-sand/30 opacity-70"; mark = ""; }
      } else {
        if (isCorrectOpt) { cls = "border-leash bg-leash-light"; mark = wasSelected ? `<span class="text-leash-ink text-xs font-700 shrink-0">✔ 你的選擇</span>` : `<span class="text-leash-ink text-xs font-700 shrink-0">✔ 正確答案</span>`; }
        else if (wasSelected) { cls = "border-rose bg-rose-light"; mark = `<span class="text-rose-ink text-xs font-700 shrink-0">你的選擇</span>`; }
      }

      return `<div class="border-2 rounded-xl px-4 py-3 flex items-center gap-3 ${cls}">
        <span class="font-display font-700 text-ink/50">${letterFor(i)}</span>
        <span class="flex-1">${escapeHtml(opt)}</span>
        ${mark}
      </div>`;
    }).join("");
  }

        ${poolCount === 0 ? `<p class="text-xs text-rose-ink mt-2">這個範圍目前沒有題目喔，換一個熟練度試試。</p>` : ""}
      </section>`;

    document.getElementById("backHome").onclick = () => go("home");
    document.querySelectorAll(".filterBtn").forEach(btn => {
      btn.onclick = () => { studySetupFilter = btn.dataset.filter; renderStudySetup(); };
    });
    const startBtn = document.getElementById("startStudy");
    if (startBtn) startBtn.onclick = () => startStudySession(poolForFilter(studySetupFilter));
  }

  function startStudySession(pool) {
    const queue = shuffle(pool).map(prepareInstance);
    study = { queue, idx: 0, results: {}, selectedSet: new Set() };
    go("studySession");
  }

  /* ---------------------------------------------------------------
   * Study mode — session
   * ------------------------------------------------------------- */
  function renderStudySession() {
    const total = study.queue.length;
    const q = study.queue[study.idx];
    const level = getLevel(q.id);
    const isMultiple = q.type === "multiple";
    const res = study.results[study.idx];
    const answered = !!res;
    const answeredCount = Object.keys(study.results).length;
    const correctSoFar = Object.values(study.results).filter(r => r.correct).length;

    app.innerHTML = `
      <section class="mt-2">
        <div class="bg-paper border border-line rounded-xl px-4 py-3 flex items-center justify-between flex-wrap gap-2">
          <button id="endStudy" class="focus-ring px-4 py-2 rounded-xl border-2 border-rose text-rose-ink font-display font-700 hover:bg-rose-light transition-colors">■ 結束學習</button>
          <span class="text-sm text-ink/60">第 ${study.idx + 1} / ${total} 題・本輪已答對 ${correctSoFar}/${answeredCount}</span>
        </div>
        <div class="w-full bg-line rounded-full h-1.5 mt-2 overflow-hidden">
          <div class="bg-leash h-1.5 rounded-full" style="width:${(study.idx / total) * 100}%"></div>
        </div>

        <div class="bg-paper border border-line rounded-2xl p-5 md:p-6 mt-5 pop-in">
          <div class="flex items-center justify-between gap-3">
            <span class="text-xs font-700 px-2.5 py-1 rounded-full ${isMultiple ? "bg-mustard-light text-mustard-ink" : "bg-leash-light text-leash-ink"}">${isMultiple ? "多選題" : "單選題"}</span>
            <div id="dogDisplay" class="shrink-0">${dogHtml(level, "text-xl")}</div>
          </div>
          <h3 class="font-display text-lg font-700 leading-relaxed mt-3 w-full">${escapeHtml(q.question)}</h3>
          ${isMultiple ? `<p class="text-xs text-mustard-ink mt-1.5 font-medium">※ 請選出所有正確答案後按下「送出答案」</p>` : `<p class="text-xs text-ink/40 mt-1.5">點選一個選項即可看結果</p>`}

          <div id="optionsWrap" class="mt-4 space-y-2.5">
            ${answered
              ? revealedOptionHtml(q.options, q.correctIndices, res.selected, isMultiple)
              : (isMultiple ? multiOptionHtml(q.options, study.selectedSet, "leash") : singleOptionHtml(q.options))}
          </div>

          ${(!answered && isMultiple) ? `<button id="submitMulti" ${study.selectedSet.size === 0 ? "disabled" : ""}
              class="focus-ring mt-4 px-5 py-2.5 rounded-xl font-display font-700 text-ink bg-mustard hover:bg-mustard-dark hover:text-white disabled:opacity-40 disabled:cursor-not-allowed">送出答案</button>` : ""}

          <div id="feedback" class="${answered ? "" : "hidden"} mt-5">
            ${answered ? `
              <div class="rounded-xl border p-4 ${res.correct ? "border-leash bg-leash-light" : "border-rose bg-rose-light"}">
                <p class="font-display font-700 ${res.correct ? "text-leash-ink" : "text-rose-ink"}">
                  ${res.correct ? "✅ 答對了！" : "❌ 答錯了"} <span class="ml-2 text-sm font-body font-normal">熟練度 ${dogHtml(res.newLevel)}</span>
                </p>
                ${q.explanation ? `<p class="text-sm text-ink/80 mt-2 leading-relaxed whitespace-pre-line">${escapeHtml(formatExplanation(q.explanation))}</p>` : ""}
              </div>` : ""}
          </div>
        </div>

        <div class="flex justify-end mt-5">
          <button id="nextStudy" class="${answered ? "" : "hidden"} focus-ring px-6 py-3 rounded-xl font-display font-700 text-white bg-leash hover:bg-leash-dark">
            ${study.idx === total - 1 ? "完成本輪" : "下一題"}
          </button>
        </div>
      </section>`;

    document.getElementById("endStudy").onclick = () => go("studyDone");

    if (!answered) {
      if (isMultiple) {
        document.querySelectorAll(".multiOptBtn").forEach(btn => {
          btn.onclick = () => {
            const i = parseInt(btn.dataset.i, 10);
            if (study.selectedSet.has(i)) study.selectedSet.delete(i); else study.selectedSet.add(i);
            renderStudySession();
          };
        });
        const submitBtn = document.getElementById("submitMulti");
        if (submitBtn) submitBtn.onclick = () => {
          if (study.selectedSet.size === 0) return;
          finalizeStudyAnswer(q, Array.from(study.selectedSet));
        };
      } else {
        document.querySelectorAll(".singleOptBtn").forEach(btn => {
          btn.onclick = () => finalizeStudyAnswer(q, [parseInt(btn.dataset.i, 10)]);
        });
      }
    } else {
      const nextBtn = document.getElementById("nextStudy");
      nextBtn.onclick = () => {
        if (study.idx < study.queue.length - 1) {
          study.idx++;
          study.selectedSet = new Set();
          renderStudySession();
        } else {
          go("studyDone");
        }
      };
    }
  }

  function finalizeStudyAnswer(q, selectedIndices) {
    const correct = setsEqual(selectedIndices, q.correctIndices);
    const newLevel = bumpLevel(q.id, correct);
    incrementTotalAnswered();
    study.results[study.idx] = { selected: selectedIndices, correct, newLevel };
    renderStudySession();
  }

  function renderStudyDone() {
    const s = overallStats();
    const answeredCount = study ? Object.keys(study.results).length : 0;
    const correctCount = study ? Object.values(study.results).filter(r => r.correct).length : 0;

    // Record this round in exam history (only when something was actually
    // answered) before syncing, so the upload includes this round too.
    let reviewItems = [];
    if (study && answeredCount > 0) {
      reviewItems = Object.keys(study.results).map(idxStr => {
        const idx = parseInt(idxStr, 10);
        const q = study.queue[idx];
        const r = study.results[idx];
        return { q, selected: r.selected, correct: r.correct };
      });
      addExamHistoryEntry("學習模式", reviewItems.map(it => ({ qId: it.q.id, selected: it.selected, correct: it.correct })));
    }
    syncToCloud();

    app.innerHTML = `
      <section class="mt-6">
        <div class="text-center bg-paper border border-line rounded-2xl p-8">
          <p class="text-4xl mb-2">🎉</p>
          <h2 class="font-display text-2xl font-700 text-leash-ink">本輪學習結束</h2>
          ${answeredCount > 0 ? `<p class="text-sm text-ink/60 mt-2">這一輪答了 ${answeredCount} 題，答對 ${correctCount} 題</p>` : ""}
          <p class="text-sm text-ink/60 mt-1">題庫整體掌握度目前為 ${s.pct}%</p>
          <div class="flex gap-3 justify-center mt-6 flex-wrap">
            <button id="studyAgain" class="focus-ring px-5 py-2.5 rounded-xl font-display font-700 text-white bg-leash hover:bg-leash-dark">再學習一輪</button>
            <button id="backHome2" class="focus-ring px-5 py-2.5 rounded-xl font-display font-700 border border-line hover:border-ink/40">返回首頁</button>
          </div>
        </div>

        ${reviewItems.length > 0 ? `
          <h3 class="font-display text-lg font-700 mt-6 mb-3">本輪作答明細</h3>
          <div class="space-y-3">
            ${reviewItems.map((item, i) => `
              <div class="bg-paper border rounded-xl p-4 ${item.correct ? "border-line" : "border-rose/60"}">
                <div class="flex items-start justify-between gap-3">
                  <p class="text-sm font-medium leading-relaxed"><span class="text-ink/40">${i + 1}.</span> ${escapeHtml(item.q.question)}</p>
                  <span class="shrink-0 text-xs font-display font-700 px-2 py-1 rounded-full ${item.correct ? "bg-leash-light text-leash-ink" : "bg-rose-light text-rose-ink"}">
                    ${item.correct ? "答對" : "答錯"}
                  </span>
                </div>
                <div class="mt-2.5 space-y-1.5">
                  ${revealedOptionHtml(item.q.options, item.q.correctIndices, item.selected, item.q.type === "multiple")}
                </div>
                ${item.q.explanation ? `<p class="text-xs text-ink/60 mt-2.5 leading-relaxed whitespace-pre-line">💡 ${escapeHtml(formatExplanation(item.q.explanation))}</p>` : ""}
              </div>`).join("")}
          </div>` : ""}
      </section>`;
    document.getElementById("studyAgain").onclick = () => go("studySetup");
    document.getElementById("backHome2").onclick = () => go("home");
  }

  /* ---------------------------------------------------------------
   * Test mode — setup
   * ------------------------------------------------------------- */
  let testSetupCount = 10;
  function renderTestSetup() {
    const max = bank.length;
    const counts = [];
    for (let n = 10; n <= 120; n += 10) counts.push(n);
    if (max > 0 && max < 10) counts.push(max);
    if (testSetupCount > max) testSetupCount = Math.min(10, max);

    app.innerHTML = `
      <section class="mt-2">
        <button id="backHome" class="text-sm text-ink/60 hover:text-ink focus-ring rounded">← 返回首頁</button>
        <h2 class="font-display text-2xl font-700 mt-3">測驗模式設定</h2>
        <p class="text-sm text-ink/60 mt-1">題庫共有 ${max} 題，選擇本次抽題數量。</p>

        <div class="grid grid-cols-4 sm:grid-cols-6 gap-2.5 mt-5">
          ${counts.map(n => {
            const disabled = n > max;
            const active = n === testSetupCount;
            return `<button data-n="${n}" ${disabled ? "disabled" : ""} class="countBtn focus-ring rounded-xl border py-2.5 text-sm font-medium transition-colors
              ${disabled ? "border-line/60 text-ink/30 cursor-not-allowed" : active ? "border-mustard bg-mustard-light" : "border-line bg-paper hover:border-mustard/60"}">
              ${n}
            </button>`;
          }).join("")}
        </div>

        <div class="bg-paper border border-line rounded-2xl p-5 mt-6 flex items-center justify-between">
          <div>
            <p class="text-sm text-ink/60">本次測驗</p>
            <p class="font-display text-2xl font-700 text-mustard-ink">${Math.min(testSetupCount, max)} 題</p>
          </div>
          <button id="startTest" class="focus-ring px-6 py-3 rounded-xl font-display font-700 text-ink bg-mustard hover:bg-mustard-dark hover:text-white">
            開始測驗
          </button>
        </div>
      </section>`;

    document.getElementById("backHome").onclick = () => go("home");
    document.querySelectorAll(".countBtn").forEach(btn => {
      if (btn.disabled) return;
      btn.onclick = () => { testSetupCount = parseInt(btn.dataset.n, 10); renderTestSetup(); };
    });
    document.getElementById("startTest").onclick = () => startTestSession(sample(bank, testSetupCount));
  }

  function startTestSession(pool) {
    const instances = pool.map(prepareInstance);
    test = { instances, results: {}, idx: 0, selectedSet: new Set() };
    go("testSession");
  }

  /* ---------------------------------------------------------------
   * Test mode — session (each question is answered & revealed
   * immediately, same interaction pattern as study mode; the learner
   * can freely move between questions via Prev/Next or the answer
   * sheet, and explicitly ends the test whenever they're ready). */
  /* ------------------------------------------------------------- */
  function renderAnswerSheet() {
    return `
      <div class="grid grid-cols-10 gap-1.5 sm:gap-2">
        ${test.instances.map((inst, i) => {
          const r = test.results[i];
          const isCurrent = i === test.idx;
          let cls = "border-line bg-paper text-ink/50";
          if (r) cls = r.correct ? "border-leash bg-leash-light text-leash-ink" : "border-rose bg-rose-light text-rose-ink";
          if (isCurrent) cls += " ring-2 ring-mustard-dark";
          return `<button data-i="${i}" class="jumpBtn focus-ring h-8 w-full rounded-lg text-xs font-medium border flex items-center justify-center ${cls}">
            ${i + 1}
          </button>`;
        }).join("")}
      </div>`;
  }

  function renderTestSession() {
    const total = test.instances.length;
    const q = test.instances[test.idx];
    const isMultiple = q.type === "multiple";
    const res = test.results[test.idx];
    const answered = !!res;
    const answeredCount = Object.keys(test.results).length;

    app.innerHTML = `
      <section class="mt-2">
        <div class="bg-paper border border-line rounded-xl px-4 py-3 flex items-center justify-between flex-wrap gap-2">
          <button id="endTest" class="focus-ring px-4 py-2 rounded-xl border-2 border-rose text-rose-ink font-display font-700 hover:bg-rose-light transition-colors">■ 結束測驗</button>
          <span class="text-sm text-ink/60">已作答 ${answeredCount} / ${total}</span>
        </div>

        <div class="bg-paper border border-line rounded-2xl p-4 mt-4">
          ${renderAnswerSheet()}
        </div>

        <div class="bg-paper border border-line rounded-2xl p-5 md:p-6 mt-4 pop-in">
          <div class="flex items-center justify-between gap-3">
            <span class="text-xs font-700 px-2.5 py-1 rounded-full ${isMultiple ? "bg-mustard-light text-mustard-ink" : "bg-leash-light text-leash-ink"}">${isMultiple ? "多選題" : "單選題"}</span>
            <span class="text-xs text-ink/50 shrink-0">第 ${test.idx + 1} / ${total} 題</span>
          </div>
          <h3 class="font-display text-lg font-700 leading-relaxed mt-3 w-full">${escapeHtml(q.question)}</h3>
          ${isMultiple ? `<p class="text-xs text-mustard-ink mt-1.5 font-medium">※ 請選出所有正確答案後按下「送出答案」</p>` : `<p class="text-xs text-ink/40 mt-1.5">點選一個選項即可看結果</p>`}

          <div id="optionsWrap" class="mt-4 space-y-2.5">
            ${answered
              ? revealedOptionHtml(q.options, q.correctIndices, res.selected, isMultiple)
              : (isMultiple ? multiOptionHtml(q.options, test.selectedSet, "mustard") : singleOptionHtml(q.options))}
          </div>

          ${(!answered && isMultiple) ? `<button id="submitMulti" ${test.selectedSet.size === 0 ? "disabled" : ""}
              class="focus-ring mt-4 px-5 py-2.5 rounded-xl font-display font-700 text-ink bg-mustard hover:bg-mustard-dark hover:text-white disabled:opacity-40 disabled:cursor-not-allowed">送出答案</button>` : ""}

          ${answered ? `
            <div class="rounded-xl border p-4 mt-5 ${res.correct ? "border-leash bg-leash-light" : "border-rose bg-rose-light"}">
              <p class="font-display font-700 ${res.correct ? "text-leash-ink" : "text-rose-ink"}">
                ${res.correct ? "✅ 答對了！" : "❌ 答錯了"}
              </p>
              ${q.explanation ? `<p class="text-sm text-ink/80 mt-2 leading-relaxed whitespace-pre-line">${escapeHtml(formatExplanation(q.explanation))}</p>` : ""}
            </div>` : ""}
        </div>

        <div class="flex items-center justify-between mt-5 gap-3">
          <button id="prevQ" ${test.idx === 0 ? "disabled" : ""} class="focus-ring px-5 py-2.5 rounded-xl font-display font-700 text-ink bg-paper border-2 border-ink/30 hover:bg-sand hover:border-ink/50 disabled:opacity-30 disabled:cursor-not-allowed">← 上一題</button>
          <div class="flex gap-3">
            <button id="nextQ" ${test.idx === total - 1 ? "disabled" : ""} class="focus-ring px-5 py-2.5 rounded-xl font-display font-700 text-ink bg-paper border-2 border-ink/30 hover:bg-sand hover:border-ink/50 disabled:opacity-30 disabled:cursor-not-allowed">下一題 →</button>
            <button id="submitTest" class="focus-ring px-5 py-2.5 rounded-xl font-display font-700 text-white bg-rose hover:bg-rose-dark">結束測驗</button>
          </div>
        </div>
      </section>`;

    document.getElementById("endTest").onclick = () => attemptEndTest();
    document.getElementById("submitTest").onclick = () => attemptEndTest();

    document.querySelectorAll(".jumpBtn").forEach(btn => {
      btn.onclick = () => { test.idx = parseInt(btn.dataset.i, 10); test.selectedSet = new Set(); renderTestSession(); };
    });

    if (!answered) {
      if (isMultiple) {
        document.querySelectorAll(".multiOptBtn").forEach(btn => {
          btn.onclick = () => {
            const i = parseInt(btn.dataset.i, 10);
            if (test.selectedSet.has(i)) test.selectedSet.delete(i); else test.selectedSet.add(i);
            renderTestSession();
          };
        });
        const submitBtn = document.getElementById("submitMulti");
        if (submitBtn) submitBtn.onclick = () => {
          if (test.selectedSet.size === 0) return;
          finalizeTestAnswer(q, Array.from(test.selectedSet));
        };
      } else {
        document.querySelectorAll(".singleOptBtn").forEach(btn => {
          btn.onclick = () => finalizeTestAnswer(q, [parseInt(btn.dataset.i, 10)]);
        });
      }
    }

    document.getElementById("prevQ").onclick = () => { if (test.idx > 0) { test.idx--; test.selectedSet = new Set(); renderTestSession(); } };
    document.getElementById("nextQ").onclick = () => { if (test.idx < total - 1) { test.idx++; test.selectedSet = new Set(); renderTestSession(); } };
  }

  function finalizeTestAnswer(q, selectedIndices) {
    const correct = setsEqual(selectedIndices, q.correctIndices);
    const newLevel = bumpLevel(q.id, correct);
    incrementTotalAnswered();
    test.results[test.idx] = { selected: selectedIndices, correct, newLevel };
    renderTestSession();
  }

  function attemptEndTest() {
    const total = test.instances.length;
    const answeredCount = Object.keys(test.results).length;
    const unanswered = total - answeredCount;
    const msg = unanswered > 0
      ? `還有 ${unanswered} 題尚未作答，未作答的題目不計入正確也不會更新熟練度。確定要結束測驗嗎？`
      : "確定要結束測驗並查看總結嗎？";
    showConfirmModal({
      title: "結束測驗",
      message: msg,
      confirmLabel: "結束測驗",
      danger: true,
      onConfirm: finalizeTest
    });
  }

  function finalizeTest() {
    const review = test.instances.map((q, i) => {
      const r = test.results[i];
      if (r) return { q, selected: r.selected, correct: r.correct, newLevel: r.newLevel, answered: true };
      return { q, selected: [], correct: false, newLevel: getLevel(q.id), answered: false };
    });
    const correctCount = review.filter(r => r.correct).length;
    lastTestReview = review;

    // Resolve back to the FULL original bank objects (looked up once, here,
    // by the question's global unique id — never by loop/array index) so
    // "重測本次錯題" / "重測本次全部題目" load exactly these questions and
    // nothing else, with zero chance of pulling in a fresh random draw.
    const allQuestions = review.map(r => bank.find(b => b.id === r.q.id)).filter(Boolean);
    const wrongQuestions = review.filter(r => !r.correct).map(r => bank.find(b => b.id === r.q.id)).filter(Boolean);

    test.result = {
      correctCount,
      total: review.length,
      accuracy: Math.round((correctCount / review.length) * 100),
      allQuestions,
      wrongQuestions
    };

    // Record this attempt in exam history (answered questions get their real
    // pick; unanswered ones are logged with no selection, consistent with
    // how they're already scored as incorrect above).
    addExamHistoryEntry("測驗模式", review.map(r => ({ qId: r.q.id, selected: r.selected, correct: r.correct })));

    syncToCloud();
    go("testResult");
  }

  function renderTestResult() {
    const r = test.result;
    const review = lastTestReview;
    const wrongCount = review.filter(item => !item.correct).length;

    app.innerHTML = `
      <section class="mt-2">
        <div class="bg-paper border border-line rounded-2xl p-6 text-center">
          <p class="text-4xl mb-2">${r.accuracy >= 80 ? "🏆" : r.accuracy >= 50 ? "🐕" : "🦴"}</p>
          <h2 class="font-display text-2xl font-700">測驗結果</h2>
          <p class="font-display text-4xl font-800 text-leash-ink mt-2">${r.accuracy}%</p>
          <p class="text-sm text-ink/60 mt-1">答對 ${r.correctCount} / ${r.total} 題</p>
          <div class="flex gap-3 justify-center mt-5 flex-wrap">
            <button id="backHome3" class="focus-ring px-5 py-2.5 rounded-xl font-display font-700 border border-line hover:border-ink/40">返回首頁</button>
            <button id="retestAll" class="focus-ring px-5 py-2.5 rounded-xl font-display font-700 border border-line hover:border-ink/40">重測本次全部題目</button>
            ${wrongCount > 0 ? `<button id="retestWrong" class="focus-ring px-5 py-2.5 rounded-xl font-display font-700 text-white bg-rose hover:bg-rose-dark">重測本次錯題（${wrongCount} 題）</button>` : ""}
          </div>
        </div>

        <h3 class="font-display text-lg font-700 mt-6 mb-3">詳細回顧</h3>
        <div class="space-y-3">
          ${review.map((item, i) => `
            <div class="bg-paper border rounded-xl p-4 ${item.correct ? "border-line" : "border-rose/60"}">
              <div class="flex items-start justify-between gap-3">
                <p class="text-sm font-medium leading-relaxed"><span class="text-ink/40">Q${i + 1}.</span> ${escapeHtml(item.q.question)}</p>
                <span class="shrink-0 text-xs font-display font-700 px-2 py-1 rounded-full ${!item.answered ? "bg-line text-ink/50" : item.correct ? "bg-leash-light text-leash-ink" : "bg-rose-light text-rose-ink"}">
                  ${!item.answered ? "未作答" : item.correct ? "答對" : "答錯"}
                </span>
              </div>
              <div class="mt-2.5 space-y-1.5">
                ${revealedOptionHtml(item.q.options, item.q.correctIndices, item.selected, item.q.type === "multiple")}
              </div>
              ${item.q.explanation ? `<p class="text-xs text-ink/60 mt-2.5 leading-relaxed whitespace-pre-line">💡 ${escapeHtml(formatExplanation(item.q.explanation))}</p>` : ""}
              <p class="text-xs text-ink/40 mt-2">${item.answered ? `熟練度更新為 ${dogHtml(item.newLevel)}` : `未作答，熟練度維持 ${dogHtml(item.newLevel)}`}</p>
            </div>`).join("")}
        </div>
      </section>`;

    document.getElementById("backHome3").onclick = () => go("home");
    document.getElementById("retestAll").onclick = () => {
      // Use the exact snapshot taken at finalize time — this test's own
      // questions, not a fresh random sample from the bank.
      startTestSession(r.allQuestions);
    };
    const retestWrongBtn = document.getElementById("retestWrong");
    if (retestWrongBtn) {
      retestWrongBtn.onclick = () => {
        // Same guarantee: only the questions this attempt actually got wrong
        // (matched by global unique id at finalize time), never re-drawn.
        startTestSession(r.wrongQuestions);
      };
    }
  }

  /* ---------------------------------------------------------------
   * Exam history — lists recent finished rounds; each card can expand to
   * re-fetch full question text/options/explanation from the *current*
   * bank by q.id (the log itself only stores id + chosen letters).
   * ------------------------------------------------------------- */
  function renderExamHistory() {
    const history = getExamHistory();
    app.innerHTML = `
      <section class="mt-2">
        <button id="backHome" class="text-sm text-ink/60 hover:text-ink focus-ring rounded">← 返回首頁</button>
        <h2 class="font-display text-2xl font-700 mt-3">📋 答題歷史記錄</h2>
        <p class="text-sm text-ink/60 mt-1">保留最近 ${MAX_HISTORY_ENTRIES} 筆學習/測驗紀錄，換裝置登入同員編也會自動合併。</p>
        <div id="examHistoryList" class="mt-4 space-y-3">
          ${history.length === 0
            ? `<div class="bg-paper border border-line rounded-2xl p-6 text-center text-sm text-ink/50">還沒有任何紀錄，完成一輪學習或測驗後就會出現在這裡。</div>`
            : history.map((entry, i) => examHistoryCardHtml(entry, i)).join("")}
        </div>
      </section>`;
    document.getElementById("backHome").onclick = () => go("home");

    history.forEach((entry, i) => {
      const toggleBtn = document.getElementById(`historyToggle-${i}`);
      if (toggleBtn) toggleBtn.onclick = () => toggleExamHistoryDetail(entry, i);
    });
  }

  function examHistoryCardHtml(entry, i) {
    const modeBadgeColor = entry.mode === "測驗模式" ? "bg-mustard-light text-mustard-ink" : "bg-leash-light text-leash-ink";
    return `
      <div class="bg-paper border border-line rounded-xl p-4">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div>
            <span class="text-xs font-700 px-2 py-1 rounded-full ${modeBadgeColor}">${escapeHtml(entry.mode || "")}</span>
            <span class="text-xs text-ink/40 ml-2">${escapeHtml(entry.timestamp || "")}</span>
          </div>
          <span class="text-sm font-display font-700">
            <span class="text-leash-ink">✔ ${entry.correctCount}</span> 題 /
            <span class="text-rose-ink">✘ ${entry.wrongCount}</span> 題
          </span>
        </div>
        <button id="historyToggle-${i}" class="focus-ring mt-3 text-xs font-700 text-ink/60 hover:text-ink underline underline-offset-2">展開檢視題目明細 ▾</button>
        <div id="historyDetail-${i}" class="hidden mt-3 space-y-2.5"></div>
      </div>`;
  }

  function toggleExamHistoryDetail(entry, i) {
    const detailEl = document.getElementById(`historyDetail-${i}`);
    const toggleBtn = document.getElementById(`historyToggle-${i}`);
    if (!detailEl || !toggleBtn) return;
    const isHidden = detailEl.classList.contains("hidden");
    if (!isHidden) {
      detailEl.classList.add("hidden");
      toggleBtn.textContent = "展開檢視題目明細 ▾";
      return;
    }
    toggleBtn.textContent = "收合題目明細 ▴";
    detailEl.classList.remove("hidden");
    if (detailEl.dataset.rendered === "1") return; // build the detail HTML once, then just toggle visibility

    detailEl.innerHTML = entry.details.map((d, j) => {
      const q = bank.find(b => String(b.id) === String(d.qId));
      if (!q) {
        return `<div class="border border-line rounded-lg p-3 text-xs text-ink/50">第 ${j + 1} 題（ID: ${escapeHtml(d.qId)}）在目前題庫中找不到，可能題庫已更新。</div>`;
      }
      const selectedIndices = (d.userAns || []).map(indexForLetter).filter(n => n >= 0);
      const isMultiple = q.type === "multiple";
      return `
        <div class="border rounded-lg p-3 ${d.isCorrect ? "border-line" : "border-rose/60"}">
          <div class="flex items-start justify-between gap-2">
            <p class="text-sm font-medium leading-relaxed"><span class="text-ink/40">${j + 1}.</span> ${escapeHtml(q.question)}</p>
            <span class="shrink-0 text-xs font-display font-700 px-2 py-0.5 rounded-full ${d.isCorrect ? "bg-leash-light text-leash-ink" : "bg-rose-light text-rose-ink"}">
              ${d.isCorrect ? "答對" : "答錯"}
            </span>
          </div>
          <div class="mt-2 space-y-1.5">
            ${revealedOptionHtml(q.options, q.answer, selectedIndices, isMultiple)}
          </div>
          ${q.explanation ? `<p class="text-xs text-ink/60 mt-2 leading-relaxed whitespace-pre-line">💡 ${escapeHtml(formatExplanation(q.explanation))}</p>` : ""}
        </div>`;
    }).join("");
    detailEl.dataset.rendered = "1";
  }

  /* ---------------------------------------------------------------
   * Leaderboard — pulls every colleague's aggregate stats from the
   * Google Sheet (via the Apps Script web app) and ranks them by
   * mastery percentage.
   * ------------------------------------------------------------- */
  function renderLeaderboard() {
    app.innerHTML = `
      <section class="mt-2">
        <button id="backHome" class="text-sm text-ink/60 hover:text-ink focus-ring rounded">← 返回首頁</button>
        <h2 class="font-display text-2xl font-700 mt-3">🏆 排行榜</h2>
        <p class="text-sm text-ink/60 mt-1">依「掌握百分比」排序，資料每次進入本頁都會重新讀取。</p>
        <div id="leaderboardBody" class="mt-4">
          <div class="bg-paper border border-line rounded-2xl p-6 text-center text-sm text-ink/50">載入中...</div>
        </div>
      </section>`;
    document.getElementById("backHome").onclick = () => go("home");

    if (!isCloudConfigured()) {
      document.getElementById("leaderboardBody").innerHTML = `
        <div class="bg-paper border border-line rounded-2xl p-6 text-center text-sm text-ink/60 leading-relaxed">
          尚未設定雲端同步網址，排行榜暫時無法使用。<br>
          請把程式碼開頭的 <code class="bg-sand px-1.5 py-0.5 rounded border border-line">GAS_API_URL</code>
          換成你部署好的 Google Apps Script 網址。
        </div>`;
      return;
    }

    fetch(GAS_API_URL)
      .then(res => res.json())
      .then(json => {
        if (!json || json.status !== "ok" || !Array.isArray(json.data)) throw new Error("bad response");
        renderLeaderboardList(json.data);
      })
      .catch(() => {
        const body = document.getElementById("leaderboardBody");
        if (!body) return;
        body.innerHTML = `
          <div class="bg-paper border border-rose/50 rounded-2xl p-6 text-center text-sm text-rose-ink">
            讀取排行榜失敗，請確認網路連線或稍後再試。
            <div class="mt-3"><button id="retryLeaderboard" class="focus-ring px-4 py-2 rounded-xl border-2 border-line hover:border-ink/40 font-display font-700">重新載入</button></div>
          </div>`;
        const retryBtn = document.getElementById("retryLeaderboard");
        if (retryBtn) retryBtn.onclick = () => renderLeaderboard();
      });
  }

  function renderLeaderboardList(list) {
    const body = document.getElementById("leaderboardBody");
    if (!body) return; // the person may have already navigated away
    const sorted = list.slice().sort((a, b) => (Number(b.masteryPercent) || 0) - (Number(a.masteryPercent) || 0));
    const myIdentity = getIdentity();
    const myId = myIdentity ? myIdentity.employeeId : null;

    if (sorted.length === 0) {
      body.innerHTML = `<div class="bg-paper border border-line rounded-2xl p-6 text-center text-sm text-ink/60">目前還沒有同事的資料，完成一輪學習或測驗後就會出現在這裡。</div>`;
      return;
    }

    body.innerHTML = sorted.map((entry, i) => {
      const rank = i + 1;
      const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : ("#" + rank);
      const isMe = myId && String(entry.employeeId) === String(myId);
      const pct = Math.max(0, Math.min(100, Math.round(Number(entry.masteryPercent) || 0)));
      return `
        <div class="bg-paper border-2 ${isMe ? "border-leash" : "border-line"} rounded-xl p-4 mb-3 ${isMe ? "bg-leash-light" : ""}">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <span class="font-display text-lg font-800 w-9 text-center shrink-0">${medal}</span>
              <div class="min-w-0">
                <p class="font-display font-700 truncate">${escapeHtml(entry.name || "未命名")}${isMe ? ' <span class="text-xs text-leash-ink font-body font-normal">（我）</span>' : ""}</p>
                <p class="text-xs text-ink/50">${escapeHtml(String(entry.employeeId || ""))}</p>
              </div>
            </div>
            <div class="text-right shrink-0">
              <p class="font-display text-lg font-700 text-leash-ink">${pct}%</p>
              <p class="text-xs text-ink/50">${dogHtml(3, "text-xs")} × ${Number(entry.threeDogCount) || 0}</p>
            </div>
          </div>
          <div class="w-full bg-line rounded-full h-1.5 mt-3 overflow-hidden">
            <div class="bg-leash h-1.5 rounded-full" style="width:${pct}%"></div>
          </div>
          <div class="flex items-center justify-between mt-2">
            <p class="text-xs text-ink/40">累積練習 ${Number(entry.totalAnswered) || 0} 題</p>
            <p class="text-xs text-ink/40">最近更新：${escapeHtml(formatDateTime(entry.lastUpdated))}</p>
          </div>
        </div>`;
    }).join("");
  }


  /* ---------------------------------------------------------------
   * Header controls
   * ------------------------------------------------------------- */
  document.getElementById("resetProgressBtn").onclick = () => {
    showConfirmModal({
      title: "重置進度",
      message: "確定要清除所有熟練度紀錄嗎？此動作無法復原。",
      confirmLabel: "清除",
      danger: true,
      onConfirm: () => {
        progress = {};
        saveProgress(progress);
        render();
      }
    });
  };

  document.getElementById("editIdentityBtn").onclick = () => {
    showIdentityModal({
      allowCancel: true,
      onSaved: () => {
        // Show this identity's own local data immediately (no leftover from
        // whoever used this device before), then pull whatever this employee
        // ID already has in the cloud (merging by the higher dog count per
        // question), and push the merged result back.
        render();
        tryCloudRestore().then(syncToCloud);
      }
    });
  };

  /* ---------------------------------------------------------------
   * "Add to Home Screen" install guide — a small floating card shown once
   * (per browser) to nudge people toward the full-screen app experience.
   * Skipped entirely if already running as an installed app, or if the
   * person has previously dismissed it.
   * ------------------------------------------------------------- */
  const PWA_PROMPT_DISMISSED_KEY = "pwa_prompt_dismissed";

  function isRunningStandalone() {
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.navigator && window.navigator.standalone === true) return true; // older iOS Safari
    } catch (e) {}
    return false;
  }

  function detectMobilePlatform() {
    const ua = (navigator.userAgent || navigator.vendor || "").toLowerCase();
    if (/iphone|ipad|ipod/.test(ua)) return "ios";
    if (/android/.test(ua)) return "android";
    return null; // desktop or unrecognized — the install card isn't shown
  }

  function shouldShowInstallPrompt() {
    try {
      if (isRunningStandalone()) return false;
      if (localStorage.getItem(PWA_PROMPT_DISMISSED_KEY) === "1") return false;
      return !!detectMobilePlatform();
    } catch (e) { return false; }
  }

  function dismissInstallPrompt(cardEl) {
    try { localStorage.setItem(PWA_PROMPT_DISMISSED_KEY, "1"); } catch (e) {}
    cardEl.style.opacity = "0";
    cardEl.style.transform = "translateY(12px)";
    setTimeout(() => cardEl.remove(), 250);
  }

  function showInstallPromptCard() {
    if (!shouldShowInstallPrompt()) return;
    if (document.getElementById("installPromptCard")) return; // already showing

    const platform = detectMobilePlatform();
    const instructions = platform === "ios"
      ? "點擊瀏覽器底部的「分享」按鈕（⬆️ 方塊箭頭圖示），往下滑選取「加入主畫面」，即可享有全螢幕 App 體驗！"
      : "點擊右上角「更多」選單（⋮ 三個點），選取「安裝應用程式」或「新增至主螢幕」。";

    const card = document.createElement("div");
    card.id = "installPromptCard";
    card.className = "fixed left-4 right-4 z-40 pop-in";
    card.style.bottom = "max(1rem, env(safe-area-inset-bottom))";
    card.style.transition = "opacity .25s ease, transform .25s ease";
    card.innerHTML = `
      <div class="bg-paper border border-line shadow-lg rounded-2xl p-4 flex items-start gap-3 max-w-md mx-auto">
        <span class="text-2xl shrink-0">📲</span>
        <div class="flex-1 min-w-0">
          <p class="font-display font-700 text-ink text-sm">加入主畫面，體驗完整 App</p>
          <p class="text-xs text-ink/60 mt-1 leading-relaxed">${instructions}</p>
        </div>
        <button id="dismissInstallPromptBtn" class="focus-ring shrink-0 text-xs font-700 text-ink/50 hover:text-ink px-2 py-1 rounded-lg whitespace-nowrap">我知道了</button>
      </div>`;
    document.body.appendChild(card);
    document.getElementById("dismissInstallPromptBtn").onclick = () => dismissInstallPrompt(card);
  }

  /* ---------------------------------------------------------------
   * Boot
   * ------------------------------------------------------------- */
  function afterIdentityReady() {
    refreshHeaderIdentity();
    render();
    tryCloudRestore();
    showInstallPromptCard();
  }

  const existingIdentity = getIdentity();
  if (!existingIdentity) {
    refreshHeaderIdentity();
    showIdentityModal({ allowCancel: false, onSaved: afterIdentityReady });
  } else {
    afterIdentityReady();
  }
})();
</script>
</body>
</html>
